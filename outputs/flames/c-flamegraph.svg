<text x="30" y="44" font-size="29" font-weight="bold">C implementation — sampled-stack flame graph</text>
<text x="30" y="76" font-size="16">macOS sample • 8 s • 1 ms interval • 6,203 stack samples</text>
<text x="30" y="102" font-size="16">Width = share of sampled stacks, including terminal I/O waits. Each graph is normalized independently.</text>
<text x="30" y="411" font-size="14">Bottom → top: caller → callee. Blue/gray = syscall or synchronization frame; warm colors = other functions.</text>
